<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deutsche Welt — ÖSD A2</title>
    <meta name="description" content="Eine kleine Alpenstadt, in der jedes Haus ein Thema der ÖSD-Zertifikat-A2-Prüfung ist." />
    <!-- Inline so the page stays a single self-contained build with no extra request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23eadfc4'/%3E%3Cpath d='M4 28h24v-2H4z' fill='%2321202b'/%3E%3Cpath d='M8 26V15h16v11z' fill='%23fffdf7' stroke='%2321202b' stroke-width='2'/%3E%3Cpath d='M6 16 16 7l10 9z' fill='%23d92b3a' stroke='%2321202b' stroke-width='2' stroke-linejoin='round'/%3E%3Crect x='14' y='19' width='4' height='7' fill='%232f6fd0' stroke='%2321202b' stroke-width='1.5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="labels" class="labels"></div>
      <div id="hud"></div>
      <div id="sheet" class="sheet" hidden>
        <button id="sheet-close" class="sheet-close" aria-label="Schließen">&times;</button>
        <div class="sheet-inner">
          <div class="sheet-head">
            <span id="sheet-icon" class="sheet-icon"></span>
            <div class="sheet-headings">
              <div id="sheet-meta" class="sheet-meta"></div>
              <h2 id="sheet-title" class="sheet-title"></h2>
            </div>
          </div>
          <p id="sheet-desc" class="sheet-desc"></p>
          <div id="sheet-stats" class="sheet-stats"></div>
          <div id="sheet-rating" class="sheet-rating"></div>
          <div class="sheet-actions">
            <button id="sheet-open" class="primary">Ausführlich öffnen</button>
          </div>
        </div>
      </div>

      <div id="panel-backdrop" class="panel-backdrop" hidden></div>
      <div id="panel" class="panel" hidden>
        <div class="panel-header">
          <span id="panel-badge" class="panel-badge"></span>
          <h2 id="panel-title"></h2>
          <button id="panel-close" class="panel-close" aria-label="Schließen">&times;</button>
        </div>
        <div id="panel-content" class="panel-content"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
